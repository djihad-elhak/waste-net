name: trash
description: "Turn trash collection into an addictive, rewarding experience."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.1

  # ── State Management ───────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5

  # ── Navigation ─────────────────────────────────────────────
  go_router: ^14.2.0

  # ── Firebase ───────────────────────────────────────────────
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3
  firebase_messaging: ^15.0.4
  firebase_remote_config: ^5.1.3
  firebase_analytics: ^11.2.1

  # ── Google Sign In ─────────────────────────────────────────
  google_sign_in: ^6.2.1

  # ── Camera & Images ────────────────────────────────────────
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  image: ^4.2.0

  # ── ONNX Inference ─────────────────────────────────────────
  onnxruntime_v2: ^1.23.2+2

  # ── Maps ───────────────────────────────────────────────────
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_map_location_marker: ^9.1.1   # shows your blue dot on the map

  # ── Animations ─────────────────────────────────────────────
  lottie: ^3.1.2
  flutter_animate: ^4.5.0

  # ── Local Storage ──────────────────────────────────────────
  shared_preferences: ^2.3.1
  hive_flutter: ^1.1.0

  # ── Networking ─────────────────────────────────────────────
  dio: ^5.7.0

  # ── Utilities ──────────────────────────────────────────────
  path_provider: ^2.1.4
  uuid: ^4.4.2
  intl: ^0.19.0
  equatable: ^2.0.5
  cached_network_image: ^3.3.1
  permission_handler: ^11.3.1
  geolocator: ^13.0.1

  # ── UI Extras ──────────────────────────────────────────────
  flutter_svg: ^2.0.10+1
  gap: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/images/
    - assets/lottie/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
